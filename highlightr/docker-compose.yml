services:
  highlights-api:
    build: .
    image: joonfjp/highlightr:1.0.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_REQUIRE_API_KEY: "${LLM_REQUIRE_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-}"
      LLM_RETRY_INITIAL_SECONDS: "${LLM_RETRY_INITIAL_SECONDS:-}"
      LLM_RETRY_MULTIPLIER: "${LLM_RETRY_MULTIPLIER:-}"
      LLM_RETRY_MAX_SECONDS: "${LLM_RETRY_MAX_SECONDS:-}"
      LLM_RETRY_JITTER_SECONDS: "${LLM_RETRY_JITTER_SECONDS:-}"
      LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-}"
      LLM_GLOBAL_CONCURRENCY: "${LLM_GLOBAL_CONCURRENCY:-}"
      LLM_MAX_PROMPT_CHARS: "${LLM_MAX_PROMPT_CHARS:-}"
      LLM_RANKING_BATCH_SIZE: "${LLM_RANKING_BATCH_SIZE:-}"
      LLM_METADATA_BATCH_SIZE: "${LLM_METADATA_BATCH_SIZE:-}"
      JOB_TTL_SECONDS: "${JOB_TTL_SECONDS:-}"
      MAX_JOBS: "${MAX_JOBS:-}"
      MAX_SRT_UPLOAD_BYTES: "${MAX_SRT_UPLOAD_BYTES:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      HIGHLIGHTS_INPUT_ROOT: "${HIGHLIGHTS_INPUT_ROOT:-./input}"
    # Health check comes from the Dockerfile HEALTHCHECK (/health).
    mem_limit: "${HIGHLIGHTR_MEM_LIMIT:-512m}"
    cpus: "${HIGHLIGHTR_CPUS:-1.0}"
