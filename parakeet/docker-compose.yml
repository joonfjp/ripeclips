services:
  # CPU-only deployment
  parakeet-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: joonfjp/parakeet:1.0.0
    container_name: parakeet-cpu
    profiles: ["cpu"]
    environment:
      PARAKEET_USE_GPU: "false"
      PARAKEET_DEFAULT_MODEL: parakeet-tdt-0.6b-v3
      PARAKEET_BATCHED: "0"
    ports:
      - "127.0.0.1:5092:5092"
    volumes:
      - parakeet-models:/app/models
    restart: unless-stopped
    # No CPU quota by default: ORT sizes its thread pools from the visible cores.
    mem_limit: "${PARAKEET_MEM_LIMIT:-12g}"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  parakeet-models:
    name: parakeet-models
